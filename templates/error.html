{% import "_ikon.html" as ikon_ %}
{% set ikon = ikon_.ikon %}
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galat {{ kode }} &middot; {{ app_name }}</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    body { display: grid; place-items: center; min-height: 100vh; background: var(--latar); }
    .kotak-galat { max-width: 460px; text-align: center; padding: 30px; }
    .kotak-galat img { width: 76px; height: 76px; margin-bottom: 18px; opacity: .95; }
    .kotak-galat .kode {
        font-size: 3.4rem; font-weight: 800; line-height: 1;
        background: linear-gradient(120deg, var(--tema), var(--hijau));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>
</head>
<body>
<div class="kotak-galat">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
    <div class="kode">{{ kode }}</div>
    <h1 style="margin-top:10px">Terjadi Kesalahan</h1>
    <p class="teks-lembut">{{ pesan }}</p>
    <div class="fleks" style="justify-content:center;gap:9px;margin-top:20px">
        <a href="{{ url_for('dashboard') }}" class="tombol">{{ ikon('beranda') }} Ke Beranda</a>
        <a href="javascript:history.back()" class="tombol sekunder">{{ ikon('kembali') }} Kembali</a>
    </div>
</div>
</body>
</html>
